name: Platform Compatibility

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install ODBC (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Install ODBC (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install unixodbc

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit Rust dependencies
        uses: actions-rust-lang/audit@v1
        with:
          ignore: >-
            RUSTSEC-2024-0384,
            RUSTSEC-2025-0004,
            RUSTSEC-2024-0436,
            RUSTSEC-2023-0055,
            RUSTSEC-2023-0086
          # Note: after running `cargo audit` locally post-upgrade,
          # replace the IDs above with the exact current advisory IDs
          # for the 6 vulnerabilities listed in the README security section.

  tls-check:
    name: HTTPS Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check no plain HTTP URLs in source
        run: |
          if grep -rn "http://" src/ --include="*.rs"; then
            echo "❌ Plain HTTP URLs found in source. Use HTTPS instead."
            exit 1
          fi
          echo "✅ No plain HTTP URLs found."